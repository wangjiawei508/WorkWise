name: Deploy WorkWise product page

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact already-published WorkWise version
        required: true
        type: string
      confirmation:
        description: Type DEPLOY-WORKWISE-PRODUCT-PAGE-vX.Y.Z
        required: true
        type: string
      mode:
        description: Full published-version page or introduction and candidate screenshots only
        required: true
        default: content-only
        type: choice
        options:
          - full
          - content-only
      operation:
        description: Render a private preview artifact or deploy the reviewed content
        required: true
        default: preview
        type: choice
        options:
          - preview
          - deploy
      source_sha:
        description: Exact 40-hex source commit (required for content-only; empty uses main for full)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: workwise-product-page-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate requested source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_MODE}" == full || "${DEPLOY_MODE}" == content-only ]]
          if [[ -n "${SOURCE_SHA}" ]]; then [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; fi
          if [[ "${DEPLOY_MODE}" == content-only ]]; then [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]; fi
          [[ "${OPERATION}" == preview || "${OPERATION}" == deploy ]]
          if [[ "${OPERATION}" == preview ]]; then [[ "${DEPLOY_MODE}" == content-only ]]; fi

      - name: Check out trusted deployment tools
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact content source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'main' }}
          path: .content-source
          persist-credentials: false

      - name: Confirm source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C .content-source rev-parse HEAD)"
          if [[ -n "${SOURCE_SHA}" ]]; then [[ "${actual}" == "${SOURCE_SHA}" ]]; fi
          git merge-base --is-ancestor "${actual}" origin/main
          echo "Trusted deployment tools: $(git rev-parse HEAD); content source: ${actual}"
          echo "WORKWISE_PRODUCT_SOURCE_SHA=${actual}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enforce explicit production approval
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${CONFIRMATION}" == "DEPLOY-WORKWISE-PRODUCT-PAGE-v${REQUESTED_VERSION}" ]]
          [[ "$(node -p "require('./.content-source/website/data/workwise-product.json').version")" == "${REQUESTED_VERSION}" ]]
          [[ "$(git rev-list -n 1 "v${REQUESTED_VERSION}")" == "$(node -p "require('./.content-source/website/data/workwise-product.json').releaseCommit")" ]]
          release_state="$(gh release view "v${REQUESTED_VERSION}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          [[ "${release_state}" == $'false\tfalse' ]]
          node scripts/deploy-workwise-product-page.mjs validate --source .content-source/website --version "${REQUESTED_VERSION}"
          if [[ "${DEPLOY_MODE}" == content-only ]]; then
            node scripts/deploy-workwise-product-page.mjs validate --source .content-source/website --version "${REQUESTED_VERSION}" --mode content-only --source-sha "${WORKWISE_PRODUCT_SOURCE_SHA}"
          fi
      - name: Test content transaction and PHP guards
        if: ${{ inputs.mode == 'content-only' }}
        env:
          WORKWISE_CONTENT_PHP_TEST: php
        run: node --test scripts/workwise-content-deploy.test.mjs
      - name: Verify official Stable version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' https://www.railwise.cn/downloads/workwise/channels/stable/latest/latest.json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          [[ "${actual}" == "${REQUESTED_VERSION}" ]]

      - name: Prepare pinned website SSH transport
        env:
          WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
          WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
          WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
          WORKWISE_WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WORKWISE_WEBSITE_SSH_PRIVATE_KEY }}
          WORKWISE_WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS }}
          WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
        run: |
          set -euo pipefail
          for name in WORKWISE_WEBSITE_SSH_HOST WORKWISE_WEBSITE_SSH_PORT WORKWISE_WEBSITE_SSH_USER WORKWISE_WEBSITE_SSH_PRIVATE_KEY WORKWISE_WEBSITE_SSH_KNOWN_HOSTS WORKWISE_WEBSITE_RELEASE_ROOT; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing ${name}"; exit 1; }
          done
          ssh_dir="${RUNNER_TEMP}/workwise-product-page-ssh"
          install -d -m 700 "${ssh_dir}"
          export SSH_KEY_PATH="${ssh_dir}/deploy-key"
          export SSH_KNOWN_HOSTS_PATH="${ssh_dir}/known_hosts"
          node - <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.SSH_KEY_PATH, `${process.env.WORKWISE_WEBSITE_SSH_PRIVATE_KEY.trim()}\n`, { mode: 0o600 })
          fs.writeFileSync(process.env.SSH_KNOWN_HOSTS_PATH, `${process.env.WORKWISE_WEBSITE_SSH_KNOWN_HOSTS.trim()}\n`, { mode: 0o600 })
          NODE
          {
            echo "WORKWISE_WEBSITE_SSH_KEY_PATH=${SSH_KEY_PATH}"
            echo "WORKWISE_WEBSITE_SSH_KNOWN_HOSTS_PATH=${SSH_KNOWN_HOSTS_PATH}"
            echo "WORKWISE_PRODUCT_PAGE_DEPLOY_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_ENV}"

      - name: Render private candidate preview
        if: ${{ inputs.operation == 'preview' }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
          WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
          WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
          WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
        run: node scripts/deploy-workwise-product-page.mjs preview --source .content-source/website --version "${REQUESTED_VERSION}" --mode content-only --source-sha "${WORKWISE_PRODUCT_SOURCE_SHA}" --deploy-id "${WORKWISE_PRODUCT_PAGE_DEPLOY_ID}" --output "${RUNNER_TEMP}/workwise-content-preview"

      - name: Upload rendered HTML and screenshot preview
        if: ${{ inputs.operation == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: workwise-content-preview-${{ env.WORKWISE_PRODUCT_SOURCE_SHA }}
          path: ${{ runner.temp }}/workwise-content-preview/
          retention-days: 7
          if-no-files-found: error

      - name: Deploy product page with server backup
        id: deploy
        if: ${{ inputs.operation != 'preview' }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
          WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
          WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
          WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
          WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
        run: node scripts/deploy-workwise-product-page.mjs deploy --source .content-source/website --version "${REQUESTED_VERSION}" --deploy-id "${WORKWISE_PRODUCT_PAGE_DEPLOY_ID}" --mode "${DEPLOY_MODE}" --source-sha "${WORKWISE_PRODUCT_SOURCE_SHA}"

      - name: Verify public page and immutable downloads
        if: ${{ inputs.operation != 'preview' }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
          WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
          WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
          WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
          WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
        run: node scripts/deploy-workwise-product-page.mjs verify-public --source .content-source/website --version "${REQUESTED_VERSION}" --deploy-id "${WORKWISE_PRODUCT_PAGE_DEPLOY_ID}" --mode "${DEPLOY_MODE}" --source-sha "${WORKWISE_PRODUCT_SOURCE_SHA}"

      - name: Roll back website after failed public verification
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DEPLOY_MODE: ${{ inputs.mode || 'full' }}
          WORKWISE_WEBSITE_SSH_HOST: ${{ secrets.WORKWISE_WEBSITE_SSH_HOST }}
          WORKWISE_WEBSITE_SSH_PORT: ${{ secrets.WORKWISE_WEBSITE_SSH_PORT }}
          WORKWISE_WEBSITE_SSH_USER: ${{ secrets.WORKWISE_WEBSITE_SSH_USER }}
          WORKWISE_WEBSITE_RELEASE_ROOT: ${{ secrets.WORKWISE_WEBSITE_RELEASE_ROOT }}
        run: |
          node scripts/deploy-workwise-product-page.mjs rollback --source .content-source/website --version "${REQUESTED_VERSION}" --deploy-id "${WORKWISE_PRODUCT_PAGE_DEPLOY_ID}" --mode "${DEPLOY_MODE}" --source-sha "${WORKWISE_PRODUCT_SOURCE_SHA}"
